spring:
  application:
    name: discord-downloader-bot
  config:
    import: "optional:consul:,optional:file:/vault/secrets/db.yaml,optional:file:/vault/secrets/s3.yaml,optional:file:/vault/secrets/discord.yaml"

  cloud:
    consul:
      host: ${SPRING_CLOUD_CONSUL_HOST:consul-server.consul.svc.cluster.local}
      port: ${SPRING_CLOUD_CONSUL_PORT:8500}
      config:
        enabled: true
        format: YAML
        data-key: data

  threads:
    virtual:
      enabled: true

  datasource:
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:30}
      minimum-idle: ${HIKARI_MIN_IDLE:10}
      idle-timeout: 60000
      connection-timeout: ${HIKARI_CONNECTION_TIMEOUT:10000}
      max-lifetime: 1800000
      leak-detection-threshold: 20000

  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:redpanda.redpanda.svc.cluster.local:9093}
    consumer:
      group-id: discord-downloader
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: downloader
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true

  flyway:
    locations: classpath:db/migration
    default-schema: downloader
    schemas: downloader

downloader:
  s3:
    endpoint: ${downloader.s3.endpoint:${gateway.garage.endpoint:${GATEWAY_GARAGE_ENDPOINT:http://garage.garage.svc.cluster.local:3900}}}
    bucket: ${downloader.s3.bucket:${gateway.garage.bucket:${GATEWAY_GARAGE_BUCKET:discord-gateway-attachments}}}
    access-key: ${downloader.s3.access-key:${GARAGE_ACCESS_KEY:${gateway.garage.access-key:}}}
    secret-key: ${downloader.s3.secret-key:${GARAGE_SECRET_KEY:${gateway.garage.secret-key:}}}
    region: ${downloader.s3.region:${GARAGE_REGION:${gateway.garage.region:garage}}}
  ytdlp-path: /usr/local/bin/yt-dlp
  ytdlp-update-cron: "0 0 4 * * *"
  ffmpeg-path: /usr/bin/ffmpeg
  ffmpeg-threads: ${FFMPEG_THREADS:2}
  tmp-dir: /tmp/discord-downloads
  discord-max-file-bytes: 26214400
  processing-timeout-seconds: 50

topics:
  inbound-interactions: discord.events.interaction.command
  inbound-commands: discord.events.message.command
  outbound-responses: discord.gateway.responses
  gateway-commands: discord.gateway.commands
  guild-updated: discord.events.guild.updated

resilience4j:
  circuitbreaker:
    instances:
      ytdlp:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      ffmpeg:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      s3Upload:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 3
      database:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3

  retry:
    instances:
      ytdlpRetry:
        maxAttempts: 2
        waitDuration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      s3Retry:
        maxAttempts: 3
        waitDuration: 1s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
      databaseRetry:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2

  bulkhead:
    instances:
      ytdlpBulkhead:
        maxConcurrentCalls: ${BULKHEAD_YTDLP_MAX_CONCURRENT:15}
        maxWaitDuration: ${BULKHEAD_YTDLP_MAX_WAIT:30s}
      ffmpegBulkhead:
        maxConcurrentCalls: ${BULKHEAD_FFMPEG_MAX_CONCURRENT:8}
        maxWaitDuration: ${BULKHEAD_FFMPEG_MAX_WAIT:30s}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics, circuitbreakers, retries
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
    diskspace:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  prometheus:
    metrics:
      export:
        enabled: true
