apiVersion: apps/v1
kind: Deployment
metadata:
  name: discord-downloader-bot
  namespace: discord-downloader-bot
  labels:
    app: discord-downloader-bot
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: discord-downloader-bot
  template:
    metadata:
      labels:
        app: discord-downloader-bot
      annotations:
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "discord-downloader-bot-role"
        vault.hashicorp.com/agent-inject-secret-db: "secret/discord-downloader-bot/db"
        vault.hashicorp.com/agent-inject-file-db: "db.yaml"
        vault.hashicorp.com/agent-inject-template-db: |
          {{- with secret "secret/discord-downloader-bot/db" -}}
          spring:
            datasource:
              url: "jdbc:postgresql://{{ .Data.data.host }}:{{ .Data.data.port }}/{{ .Data.data.dbname }}"
              username: "{{ .Data.data.username }}"
              password: "{{ .Data.data.password }}"
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-s3: "secret/discord-downloader-bot/s3"
        vault.hashicorp.com/agent-inject-file-s3: "s3.yaml"
        vault.hashicorp.com/agent-inject-template-s3: |
          {{- with secret "secret/discord-downloader-bot/s3" -}}
          downloader:
            s3:
              endpoint: "{{ .Data.data.endpoint }}"
              bucket: "{{ .Data.data.bucket }}"
              access-key: "{{ .Data.data.access_key_id }}"
              secret-key: "{{ .Data.data.secret_access_key }}"
              region: "{{ .Data.data.region | default "garage" }}"
          gateway:
            garage:
              endpoint: "{{ .Data.data.endpoint }}"
              bucket: "{{ .Data.data.bucket }}"
          GARAGE_ACCESS_KEY: "{{ .Data.data.access_key_id }}"
          GARAGE_SECRET_KEY: "{{ .Data.data.secret_access_key }}"
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-discord: "secret/discord-downloader-bot/discord"
        vault.hashicorp.com/agent-inject-file-discord: "discord.yaml"
        vault.hashicorp.com/agent-inject-template-discord: |
          {{- with secret "secret/discord-downloader-bot/discord" -}}
          discord:
            bot:
              token: "{{ .Data.data.bot_token }}"
          {{- end -}}
    spec:
      terminationGracePeriodSeconds: 60
      serviceAccountName: discord-downloader-bot
      imagePullSecrets:
        - name: ghcr-pull-secret

      containers:
        - name: discord-downloader-bot
          image: ghcr.io/gdinizds/discord-downloader-bot:v1.0.0 # {"$imagepolicy": "flux-system:discord-downloader-bot"}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            - name: SPRING_CLOUD_CONSUL_HOST
              value: "consul-server.consul.svc.cluster.local"
            - name: SPRING_CLOUD_CONSUL_PORT
              value: "8500"

          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi

          volumeMounts:
            - name: tmp-downloads
              mountPath: /tmp/discord-downloads
            - name: ytdlp-cookies
              mountPath: /app/cookies-secret
              readOnly: true
            - name: cookies-writable
              mountPath: /app/cookies

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 4

          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 12

      volumes:
        - name: tmp-downloads
          emptyDir: {}
        - name: cookies-writable
          emptyDir: {}
        - name: ytdlp-cookies
          secret:
            secretName: ytdlp-cookies
            optional: true
      restartPolicy: Always
